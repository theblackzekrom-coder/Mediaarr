<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">Media<span>arr</span></div>
        <a href="/" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span> Search
        </a>
        <a href="/library" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="2" y="7" width="4" height="14"/><rect x="9" y="4" width="4" height="17"/><rect x="16" y="2" width="4" height="19"/>
                </svg>
            </span> Library
        </a>
        <a href="/monitor" class="nav-item">
    <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
    </span> Monitor
</a>
        <a href="/collections" class="nav-item active">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </span> Collections
        </a>
        <a href="/missing" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </span> Missing

        <a href="/subtitles" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/>
                </svg>
            </span> Subtitles
        </a>
        <a href="/settings" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </span> Settings
        </a>
    </aside>

    <div class="main">
        <div class="topbar">
            <span style="color:var(--text-muted);font-size:0.9rem;">Collections</span>
            <input type="text" id="col_search" class="search-input"
                placeholder="Filter collections..."
                oninput="renderCollections()"
                style="max-width:280px;margin-left:auto;">
        </div>

        <div class="page">
            <div id="collections_grid" class="library-grid">
                <p class="loading">Loading collections...</p>
            </div>
        </div>
    </div>

    <script>
        let allCollections = []

        async function loadCollections() {
            const res = await fetch('/api/collections')
            const data = await res.json()

            if (data.error) {
                document.getElementById('collections_grid').innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            allCollections = data.collections
            renderCollections()
        }

        function renderCollections() {
            const query = document.getElementById('col_search').value.toLowerCase()
            const filtered = allCollections.filter(c =>
                !query || c.name.toLowerCase().includes(query)
            )

            if (!filtered.length) {
                document.getElementById('collections_grid').innerHTML = '<p class="loading">No collections found.</p>'
                return
            }

            document.getElementById('collections_grid').innerHTML = filtered.map(c => `
                <div class="library-card" onclick="window.location.href='/collection/${c.id}'">
                    <div class="library-poster">
                        ${c.poster
                            ? `<img src="${c.poster}" alt="${c.name}" loading="lazy">`
                            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">🗂️</div>`
                        }
                        <div class="library-type-badge">${c.movies.length} films</div>
                    </div>
                    <div class="library-info">
                        <div class="library-title">${c.name}</div>
                    </div>
                </div>
            `).join('')
        }

        loadCollections()
    </script>
</body>
</html>
