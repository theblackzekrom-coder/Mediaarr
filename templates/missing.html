    <div class="main">
        <div class="topbar">
            <span style="color: var(--text-muted); font-size: 0.9rem;">Missing Episodes</span>
            <span id="missing_count" style="color: var(--text-muted); font-size: 0.85rem; margin-left: auto;"></span>
        </div>

        <div class="page">
            <div id="missing_list"></div>
        </div>
    </div>

    <script>
        let totalMissing = 0

        async function loadMissing() {
            const res = await fetch('/api/library')
            const data = await res.json()

            if (data.error) {
                document.getElementById('missing_list').innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            const shows = data.items.filter(i => i.type === 'tv')

            if (!shows.length) {
                document.getElementById('missing_list').innerHTML = '<p class="loading">No TV shows in library.</p>'
                return
            }

            document.getElementById('missing_list').innerHTML = shows.map(show => `
                <div id="show_${show.id}" class="season-block">
                    <div class="season-header" style="display:flex;justify-content:space-between;align-items:center;">
                        <a href="/show/${show.id}" style="color:var(--purple);text-decoration:none;">${show.title}</a>
                        <span id="count_${show.id}" style="font-size:0.8rem;color:var(--text-muted);font-weight:400;">Checking...</span>
                    </div>
                    <div id="eps_${show.id}"></div>
                </div>
            `).join('')

            for (const show of shows) {
                fetchShowMissing(show)
            }
        }

        async function fetchShowMissing(show) {
            try {
                const res = await fetch(`/api/missing/${show.id}`)
                const data = await res.json()
                const missing = data.missing || []

                const countEl = document.getElementById(`count_${show.id}`)
                const epsEl = document.getElementById(`eps_${show.id}`)

                if (!missing.length) {
                    countEl.style.color = 'var(--green)'
                    countEl.textContent = '✓ Complete'
                    return
                }

                totalMissing += missing.length
                document.getElementById('missing_count').textContent = `${totalMissing} missing`

                countEl.style.color = 'var(--red)'
                countEl.textContent = `${missing.length} missing`

                epsEl.innerHTML = `
                    <div class="episode-list" style="margin-top:8px;">
                        ${missing.map(ep => `
                            <div class="episode-item missing">
                                <div class="episode-status">❌</div>
                                <div class="episode-info">
                                    <span class="episode-code">${ep}</span>
                                </div>
                                <button class="btn btn-primary btn-sm"
                                    onclick="searchEpisode('${show.title}', '${ep}')">
                                    Find
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `
            } catch {
                document.getElementById(`count_${show.id}`).textContent = 'Error'
            }
        }

        function searchEpisode(show, episode) {
            window.location.href = `/?q=${encodeURIComponent(show + ' ' + episode)}`
        }

        loadMissing()
    </script>
</body>
