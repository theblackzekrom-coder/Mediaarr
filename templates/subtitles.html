</head>
<body>

    <div class="main">
        <div class="topbar">
            <input type="text" id="sub_query" class="search-input"
                placeholder="Search subtitles by title..."
                onkeydown="if(event.key==='Enter') searchSubs()">
            <select id="sub_lang" style="min-width:120px;">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
            </select>
            <input type="number" id="sub_season" placeholder="Season" min="1"
                style="width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:0.85rem;outline:none;">
            <input type="number" id="sub_episode" placeholder="Episode" min="1"
                style="width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:0.85rem;outline:none;">
            <button class="btn btn-primary" onclick="searchSubs()">Search</button>
        </div>

        <div class="page">
            <div id="sub_results"></div>
        </div>
    </div>

    <script>
        async function searchSubs() {
            const query = document.getElementById('sub_query').value
            const lang = document.getElementById('sub_lang').value
            const season = document.getElementById('sub_season').value
            const episode = document.getElementById('sub_episode').value

            if (!query) return

            document.getElementById('sub_results').innerHTML = '<p class="loading">Searching OpenSubtitles...</p>'

            const params = new URLSearchParams({ query, languages: lang })
            if (season) params.append('season', season)
            if (episode) params.append('episode', episode)

            const res = await fetch(`/api/subtitles/search?${params}`)
            const data = await res.json()

            if (data.error) {
                document.getElementById('sub_results').innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            if (!data.results || !data.results.length) {
                document.getElementById('sub_results').innerHTML = '<p class="loading">No subtitles found.</p>'
                return
            }

            document.getElementById('sub_results').innerHTML = data.results.map(r => `
                <div class="result-card">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
                        <div style="flex:1;min-width:0;">
                            <p class="result-title">${r.release || 'Unknown release'}</p>
                            <div class="badges">
                                <span class="badge">${r.language.toUpperCase()}</span>
                                ${r.hearing_impaired ? '<span class="badge">HI</span>' : ''}
                                ${r.fps ? `<span class="badge">${r.fps} FPS</span>` : ''}
                            </div>
                            <p class="result-meta">⬇️ ${r.downloads.toLocaleString()} downloads${r.rating ? ` &nbsp;·&nbsp; ⭐ ${Number(r.rating).toFixed(1)}` : ''}</p>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
                            <button class="btn btn-primary btn-sm" onclick="downloadSub(${r.file_id}, this)">
                                Download
                            </button>
                        </div>
                    </div>
                    <div id="dl_status_${r.file_id}" style="margin-top:8px;font-size:0.82rem;"></div>
                </div>
            `).join('')
        }

        async function downloadSub(fileId, btn) {
            const statusEl = document.getElementById(`dl_status_${fileId}`)
            btn.disabled = true
            btn.textContent = 'Downloading...'

            const res = await fetch('/api/subtitles/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ file_id: fileId })
            })
            const data = await res.json()

            if (data.error) {
                statusEl.style.color = 'var(--red)'
                statusEl.textContent = data.error
                btn.disabled = false
                btn.textContent = 'Download'
            } else if (data.link) {
                // Trigger browser download
                const a = document.createElement('a')
                a.href = data.link
                a.download = ''
                a.click()
                statusEl.style.color = 'var(--green)'
                statusEl.textContent = '✓ Download started'
                btn.textContent = 'Done'
            } else {
                statusEl.style.color = 'var(--green)'
                statusEl.textContent = data.status
                btn.textContent = 'Done'
            }
        }
    </script>
</body>
</html>
