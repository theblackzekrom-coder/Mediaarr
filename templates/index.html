<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediaarr</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">Media<span>arr</span></div>
        <a href="/" class="nav-item active">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span> Search
        </a>
        <a href="/library" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="2" y="7" width="4" height="14"/><rect x="9" y="4" width="4" height="17"/><rect x="16" y="2" width="4" height="19"/>
                </svg>
            </span> Library
        </a>
        <a href="/monitor" class="nav-item">
    <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
    </span> Monitor
</a>
        <a href="/collections" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </span> Collections
        </a>
        <a href="/missing" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </span> Missing
        </a>
        <a href="/subtitles" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/>
                </svg>
            </span> Subtitles
        </a>
        <a href="/settings" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </span> Settings
        </a>
    </aside>

    <div class="main">
        <div class="topbar">
            <input type="text" id="query" class="search-input"
                placeholder="Search for a movie or show..."
                onkeydown="if(event.key === 'Enter') search()">
            <select id="profile_select" class="profile-select" onchange="loadProfile()">
                {% for p in profiles %}
                <option value="{{ p.name }}"
                    data-media-type="{{ p.get('media_type', 'both') }}"
                    {% if p.is_default %}selected{% endif %}>
                    {{ p.name }}
                </option>
                {% endfor %}
            </select>
            <select id="sort_select" class="profile-select" style="width:auto;">
                <option value="score">Best Match</option>
                <option value="size_asc">Size ↑</option>
                <option value="size_desc">Size ↓</option>
                <option value="seeders_desc">Seeders ↓</option>
                <option value="seeders_asc">Seeders ↑</option>
            </select>
            <button class="btn btn-primary" onclick="search()">Search</button>
        </div>

        <div class="page">
            <div class="filter-panel">
                <div class="filter-group">
                    <div class="filter-label">
                        Resolution
                        <label class="any-toggle">
                            <input type="checkbox" id="res_any" onchange="toggleAny('res')"> ANY
                        </label>
                    </div>
                    <div class="filter-checks" id="res_checks">
                        {% for res in all_resolutions %}
                        <label class="check-item">
                            <input type="checkbox" name="resolution" value="{{ res }}"
                                {% if res in profile.resolutions %}checked{% endif %}>
                            {{ res }}
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">
                        HDR Format
                        <label class="any-toggle">
                            <input type="checkbox" id="hdr_any" onchange="toggleAny('hdr')"> ANY
                        </label>
                    </div>
                    <div class="filter-checks" id="hdr_checks">
                        {% for hdr in all_hdr %}
                        <label class="check-item">
                            <input type="checkbox" name="hdr" value="{{ hdr }}"
                                {% if hdr in profile.hdr_formats %}checked{% endif %}>
                            {{ hdr }}
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">
                        Audio Format
                        <label class="any-toggle">
                            <input type="checkbox" id="audio_any" onchange="toggleAny('audio')"> ANY
                        </label>
                    </div>
                    <div class="filter-checks" id="audio_checks">
                        {% for audio in all_audio %}
                        <label class="check-item">
                            <input type="checkbox" name="audio" value="{{ audio }}"
                                {% if audio in profile.audio_formats %}checked{% endif %}>
                            {{ audio }}
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">
                        Source
                        <label class="any-toggle">
                            <input type="checkbox" id="source_any" onchange="toggleAny('source')"> ANY
                        </label>
                    </div>
                    <div class="filter-checks" id="source_checks">
                        {% for source in all_sources %}
                        <label class="check-item">
                            <input type="checkbox" name="source" value="{{ source }}"
                                {% if source in profile.sources %}checked{% endif %}>
                            {{ source }}
                        </label>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div id="media_banner" class="media-banner hidden"></div>
            <div id="results"></div>
        </div>
    </div>

    <script>
        let currentMediaType = "unknown"

        function toggleAny(type) {
            const map = {
                res: { any: "res_any", checks: "res_checks", name: "resolution" },
                hdr: { any: "hdr_any", checks: "hdr_checks", name: "hdr" },
                audio: { any: "audio_any", checks: "audio_checks", name: "audio" },
                source: { any: "source_any", checks: "source_checks", name: "source" }
            }
            const m = map[type]
            const anyChecked = document.getElementById(m.any).checked
            document.querySelectorAll(`#${m.checks} input`).forEach(cb => {
                cb.checked = anyChecked
                cb.disabled = anyChecked
            })
        }

        function getChecked(name) {
            return [...document.querySelectorAll(`input[name="${name}"]:checked`)]
                .map(cb => cb.value)
        }

        function filterProfilesByType(mediaType) {
            const select = document.getElementById("profile_select")
            const options = select.querySelectorAll("option")
            options.forEach(opt => {
                const profileMediaType = opt.dataset.mediaType || "both"
                const show = profileMediaType === "both" || profileMediaType === mediaType || !mediaType
                opt.style.display = show ? "" : "none"
            })
            for (const opt of options) {
                if (opt.style.display !== "none") {
                    select.value = opt.value
                    loadProfile()
                    break
                }
            }
        }

        async function loadProfile() {
            const name = document.getElementById("profile_select").value
            const res = await fetch(`/api/profile/${encodeURIComponent(name)}`)
            const profile = await res.json()
            updateChecks("resolution", profile.resolutions)
            updateChecks("hdr", profile.hdr_formats)
            updateChecks("audio", profile.audio_formats)
            updateChecks("source", profile.sources)
        }

        function updateChecks(name, values) {
            document.querySelectorAll(`input[name="${name}"]`).forEach(cb => {
                cb.checked = values.includes(cb.value)
                cb.disabled = false
            })
        }

        function sortResults(results) {
            const sort = document.getElementById("sort_select").value
            const sorted = [...results]
            if (sort === "size_asc")      sorted.sort((a, b) => a.size_gb - b.size_gb)
            else if (sort === "size_desc") sorted.sort((a, b) => b.size_gb - a.size_gb)
            else if (sort === "seeders_desc") sorted.sort((a, b) => (b.seeders || 0) - (a.seeders || 0))
            else if (sort === "seeders_asc")  sorted.sort((a, b) => (a.seeders || 0) - (b.seeders || 0))
            // "score" keeps original order (already sorted by backend)
            return sorted
        }

        let lastResults = []

        document.getElementById("sort_select").addEventListener("change", () => {
            if (lastResults.length) renderResults(sortResults(lastResults))
        })

        function renderResults(results) {
            const html = results.map((r, i) => `
                <div class="result-card">
                    ${i === 0 ? '<span class="best-badge">Best Match</span>' : ''}
                    <p class="result-title">${r.title}</p>
                    <div class="badges">
                        <span class="badge">${r.parsed.resolution || "Unknown"}</span>
                        <span class="badge">${r.parsed.hdr || "SDR"}</span>
                        <span class="badge">${r.parsed.audio || "Unknown"}</span>
                        <span class="badge">${r.parsed.source || "Unknown"}</span>
                    </div>
                    <p class="result-meta">${r.size_gb} GB &nbsp;·&nbsp; ${r.seeders} Seeders</p>
                    <div class="download-section">
                        <button class="btn btn-primary" onclick="download('${r.download_url}')">
                            Add to qBit
                        </button>
                    </div>
                </div>
            `).join("")
            document.getElementById("results").innerHTML = html
        }

        async function search() {
            const query = document.getElementById("query").value
            if (!query) return

            const resolutions = getChecked("resolution")
            const hdr_formats = getChecked("hdr")
            const audio_formats = getChecked("audio")
            const sources = getChecked("source")
            const profile_name = document.getElementById("profile_select").value

            document.getElementById("results").innerHTML = '<p class="loading">Searching...</p>'
            document.getElementById("media_banner").classList.add("hidden")

            const params = new URLSearchParams({
                query,
                profile_name,
                resolutions: resolutions.join(","),
                hdr_formats: hdr_formats.join(","),
                audio_formats: audio_formats.join(","),
                sources: sources.join(",")
            })

            const response = await fetch(`/search?${params}`)
            const data = await response.json()

            if (data.media_info && data.media_info.title) {
                const info = data.media_info
                currentMediaType = info.type
                filterProfilesByType(info.type)
                const banner = document.getElementById("media_banner")
                banner.classList.remove("hidden")
                banner.innerHTML = `
                    <div class="banner-poster">
                        ${info.poster
                            ? `<img src="${info.poster}" alt="${info.title}">`
                            : `<div class="no-poster">🎬</div>`
                        }
                    </div>
                    <div class="banner-info">
                        <div class="banner-type">${info.type === "tv" ? "📺 TV Show" : info.type === "movie" ? "🎬 Movie" : "Unknown"}</div>
                        <h2 class="banner-title">${info.title} ${info.year ? `<span class="banner-year">(${info.year})</span>` : ""}</h2>
                        <p class="banner-overview">${info.overview || ""}</p>
                    </div>
                `
            }

            if (data.error) {
                document.getElementById("results").innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            lastResults = data.results
            renderResults(sortResults(lastResults))
        }

        async function download(download_url) {
            const response = await fetch("/download", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ download_url, media_type: currentMediaType })
            })
            const data = await response.json()
            alert(data.status)
        }

        const prefill = "{{ prefill_query }}"
        if (prefill) {
            document.getElementById("query").value = prefill
            search()
        }
    </script>
</body>
</html>
