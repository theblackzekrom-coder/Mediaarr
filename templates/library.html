        <a href="/monitor" class="nav-item">

        <a href="/collections" class="nav-item">

                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </span> Collections

        <a href="/missing" class="nav-item">

                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>

    <div class="main">
        <div class="topbar">
            <div class="lib-tabs">
                <button class="tab-btn active" onclick="filterType('all', this)">All</button>
                <button class="tab-btn" onclick="filterType('tv', this)">TV Shows</button>
                <button class="tab-btn" onclick="filterType('movie', this)">Movies</button>
            </div>
            <input type="text" id="lib_search" class="search-input"
                placeholder="Filter library..."
                oninput="renderLibrary()"
                style="max-width: 280px; margin-left: auto;">
        </div>

        <div class="page">
            <div id="library_grid" class="library-grid">
                <p class="loading">Loading library...</p>
            </div>
        </div>
    </div>

    <script>
        let allItems = []
        let currentType = 'all'

        async function loadLibrary() {
            const res = await fetch('/api/library')
            const data = await res.json()

            if (data.error) {
                document.getElementById('library_grid').innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            allItems = data.items
            renderLibrary()
        }

        function filterType(type, btn) {
            currentType = type
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            renderLibrary()
        }

        function renderLibrary() {
            const query = document.getElementById('lib_search').value.toLowerCase()
            const filtered = allItems.filter(item => {
                const matchType = currentType === 'all' || item.type === currentType
                const matchQuery = !query || item.title.toLowerCase().includes(query)
                return matchType && matchQuery
            })

            if (!filtered.length) {
                document.getElementById('library_grid').innerHTML = '<p class="loading">No items found.</p>'
                return
            }

            document.getElementById('library_grid').innerHTML = filtered.map(item => `
                <div class="library-card" onclick="openItem('${item.id}', '${item.type}')">
                    <div class="library-poster">
                        ${item.poster
                            ? `<img src="${item.poster}" alt="${item.title}" loading="lazy">`
                            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">${item.type === 'tv' ? '📺' : '🎬'}</div>`
                        }
                        <div class="library-type-badge">${item.type === 'tv' ? 'TV' : 'Movie'}</div>
                    </div>
                    <div class="library-info">
                        <div class="library-title">${item.title}</div>
                        <div class="library-year">${item.year || ''}</div>
                    </div>
                </div>
            `).join('')
        }

        function openItem(jellyfinId, type) {
            if (type === 'tv') {
                window.location.href = `/show/${jellyfinId}`
            } else {
                window.location.href = `/movie/${jellyfinId}`
            }
        }

        loadLibrary()
    </script>
</body>
</html>
