<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediaarr — Collection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
    <div class="sidebar-logo">Media<span>arr</span></div>
    <a href="/" class="nav-item">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span> Search
    </a>
    <a href="/library" class="nav-item">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <rect x="2" y="7" width="4" height="14"/><rect x="9" y="4" width="4" height="17"/><rect x="16" y="2" width="4" height="19"/>
            </svg>
        </span> Library
    </a>
    <a href="/monitor" class="nav-item">
    <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
    </span> Monitor
</a>
    <a href="/collections" class="nav-item active">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
        </span> Collections
    </a>
    <a href="/missing" class="nav-item">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        </span> Missing
    </a>
    <a href="/subtitles" class="nav-item">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/>
            </svg>
        </span> Subtitles
    </a>
    <a href="/settings" class="nav-item">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </span> Settings
    </a>
</aside>

    <div class="main">
        <div class="topbar">
            <a href="/collections" class="btn btn-ghost">← Back to Collections</a>
        </div>

        <div class="page">
            <div id="collection_content"><p class="loading">Loading...</p></div>
        </div>
    </div>

    <script>
        const collectionId = parseInt("{{ collection_id }}")

        async function loadCollection() {
            const res = await fetch(`/api/collection/${collectionId}`)
            const data = await res.json()

            if (data.error) {
                document.getElementById('collection_content').innerHTML = `<p class="error">${data.error}</p>`
                return
            }

            const owned = data.movies.filter(m => m.in_library).length

            document.getElementById('collection_content').innerHTML = `
                <div style="display:flex;gap:24px;align-items:flex-start;margin-bottom:32px;">
                    ${data.poster
                        ? `<img src="${data.poster}" style="width:160px;border-radius:12px;flex-shrink:0;">`
                        : ''
                    }
                    <div>
                        <div style="font-size:0.75rem;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Collection</div>
                        <h1 style="font-size:1.8rem;font-weight:700;margin-bottom:8px;">${data.name}</h1>
                        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px;">${owned} / ${data.movies.length} in library</div>
                        ${data.overview ? `<p style="font-size:0.9rem;color:var(--text-dim);line-height:1.6;max-width:600px;">${data.overview}</p>` : ''}
                    </div>
                </div>

                <div class="library-grid">
                    ${data.movies.map(m => `
                        <div class="library-card"
                            onclick="${m.in_library ? `window.location.href='/movie/${m.jellyfin_id}'` : ''}"
                            style="${!m.in_library ? 'opacity:0.4;cursor:default;' : ''}">
                            <div class="library-poster">
                                ${m.poster
                                    ? `<img src="${m.poster}" alt="${m.title}" loading="lazy">`
                                    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">🎬</div>`
                                }
                                ${!m.in_library ? `<div class="library-type-badge" style="color:#666;">Not owned</div>` : ''}
                            </div>
                            <div class="library-info">
                                <div class="library-title">${m.title}</div>
                                <div class="library-year">${m.year || ''}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `
        }

        loadCollection()
    </script>
</body>
</html>
