<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediaarr — Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .filter-tabs { display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; }
        .filter-tab { background:none; border:none; color:var(--text-muted); padding:5px 14px; border-radius:6px; cursor:pointer; font-size:0.82rem; font-weight:500; transition:background 0.15s,color 0.15s; }
        .filter-tab.active { background:var(--surface2); color:var(--text); }

        .poster-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }

        .m-card, .s-card { position:relative; border-radius:10px; overflow:hidden; background:var(--surface); border:1px solid var(--border); transition:transform 0.15s, border-color 0.2s, box-shadow 0.2s; }
        .m-card { cursor:pointer; }
        .m-card:hover { transform:translateY(-2px); border-color:var(--purple); }
        .m-card img, .s-card img, .no-poster { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
        .no-poster { background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2.2rem; }

        .card-info { padding:9px 10px 11px; }
        .card-title { font-size:0.8rem; font-weight:600; color:var(--text); margin:0 0 5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-year { color:var(--text-muted); font-weight:400; }

        .type-tag { position:absolute; top:8px; left:8px; font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:2px 6px; border-radius:4px; background:rgba(0,0,0,0.72); color:var(--text-muted); backdrop-filter:blur(4px); }

        .remove-btn { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.72); backdrop-filter:blur(4px); border:none; color:var(--text-muted); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.15s,color 0.15s; }
        .m-card:hover .remove-btn { opacity:1; }
        .remove-btn:hover { color:#e05555; }

        .countdown { display:inline-block; font-size:0.72rem; font-weight:600; padding:2px 8px; border-radius:20px; }
        .countdown.released { background:rgba(80,200,120,0.15); color:var(--green); }
        .countdown.upcoming { background:rgba(160,100,255,0.15); color:var(--purple); }
        .countdown.ended    { background:rgba(255,255,255,0.06); color:var(--text-muted); }
        .countdown.unknown  { background:rgba(255,255,255,0.06); color:var(--text-dim); }

        .s-card.is-monitored { border-color:#e05555; box-shadow:0 0 0 2px rgba(224,85,85,0.28), 0 0 16px rgba(224,85,85,0.14); }
        .monitor-btn { width:100%; padding:5px 0; font-size:0.75rem; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text-muted); transition:background 0.15s,color 0.15s,border-color 0.15s; }
        .monitor-btn:hover { background:var(--purple); color:#fff; border-color:var(--purple); }
        .monitor-btn.is-monitored { background:#e05555; color:#fff; border-color:#e05555; cursor:default; }

        .empty-state { text-align:center; padding:50px 20px; }
        .empty-state h2 { font-size:1rem; color:var(--text-muted); margin:0 0 6px; font-weight:500; }
        .empty-state p { font-size:0.83rem; color:var(--text-dim); margin:0; }

        .search-wrap { position:relative; max-width:480px; margin-bottom:24px; }
        .search-wrap svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:0.4; }
        #monitor_search { width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 36px 10px 40px; color:var(--text); font-size:0.9rem; outline:none; }
        #search_clear { display:none; position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px; padding:0; line-height:1; }

        .section-label { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin:0 0 14px; font-weight:600; }
        .log-row { display:flex; gap:10px; align-items:baseline; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:7px; font-size:0.82rem; }
        .log-row.ok { border-color:rgba(80,200,120,0.3); }
        .log-row.fail { border-color:rgba(224,85,85,0.3); }
        .log-row.skip { opacity:0.55; }
        .log-title { font-weight:600; color:var(--text); white-space:nowrap; }
        .log-status { color:var(--text-muted); flex:1; min-width:0; }
        .log-ts { font-size:0.73rem; color:var(--text-dim); white-space:nowrap; }

        /* Modal */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; }
        .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:440px; box-shadow:0 24px 60px rgba(0,0,0,0.5); }
        .modal-title { font-size:1rem; font-weight:600; color:var(--text); margin:0 0 4px; }
        .modal-subtitle { font-size:0.82rem; color:var(--text-muted); margin:0 0 22px; }
        .modal-field { margin-bottom:16px; }
        .modal-label { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); font-weight:600; margin-bottom:6px; display:block; }
        .modal-input { width:100%; box-sizing:border-box; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-size:0.88rem; outline:none; }
        .modal-input:focus { border-color:var(--purple); }
        .modal-select { width:100%; box-sizing:border-box; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-size:0.88rem; outline:none; cursor:pointer; }
        .modal-select:focus { border-color:var(--purple); }
        .modal-path-wrap { display:flex; gap:8px; }
        .modal-path-wrap .modal-input { flex:1; }
        .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
        .modal-info { display:flex; gap:12px; align-items:center; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border); }
        .modal-poster { width:52px; height:78px; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--surface2); }
        .modal-poster-placeholder { width:52px; height:78px; border-radius:6px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
        .modal-meta { min-width:0; }
        .modal-item-title { font-size:0.95rem; font-weight:600; color:var(--text); margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .modal-item-sub { font-size:0.8rem; color:var(--text-muted); margin:0; }

        /* Browse popover */
        .browse-popover { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1100; display:flex; align-items:center; justify-content:center; }
        .browse-box { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; width:420px; max-height:60vh; display:flex; flex-direction:column; gap:10px; }
        .browse-current { font-size:0.78rem; color:var(--text-muted); word-break:break-all; }
        .browse-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .browse-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; cursor:pointer; font-size:0.85rem; color:var(--text); transition:background 0.12s; }
        .browse-item:hover { background:var(--surface2); }
        .browse-actions { display:flex; gap:8px; justify-content:flex-end; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">Media<span>arr</span></div>
        <a href="/" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span> Search</a>
        <a href="/library" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="2" y="7" width="4" height="14"/><rect x="9" y="4" width="4" height="17"/><rect x="16" y="2" width="4" height="19"/></svg></span> Library</a>
        <a href="/monitor" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span> Monitor</a>
        <a href="/collections" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Collections</a>
        <a href="/missing" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></span> Missing</a>
        <a href="/subtitles" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg></span> Subtitles</a>
        <a href="/settings" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Settings</a>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1 class="page-title">Monitor</h1>
            <div style="display:flex;gap:10px;align-items:center;">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all"   onclick="setFilter('all')">All</button>
                    <button class="filter-tab"        data-filter="movie" onclick="setFilter('movie')">Movies</button>
                    <button class="filter-tab"        data-filter="tv"    onclick="setFilter('tv')">Shows</button>
                </div>
                <button class="btn btn-primary btn-sm" id="run_btn" onclick="runNow()">&#9654; Run Now</button>
            </div>
        </div>

        <div class="page">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="monitor_search" type="text" placeholder="Search to add…"
                    oninput="onSearchInput(this.value)"
                    onkeydown="if(event.key==='Escape')clearSearch()">
                <button id="search_clear" onclick="clearSearch()">✕</button>
            </div>

            <div id="search_section" style="display:none; margin-bottom:32px;">
                <div class="section-label">Search Results</div>
                <div id="search_results"></div>
            </div>

            <div id="monitor_content">
                <p class="loading">Loading…</p>
            </div>
        </div>
    </div>

    <!-- Monitor Modal -->
    <div id="monitor_modal" class="modal-overlay" style="display:none;" onclick="closeModalOnBg(event)">
        <div class="modal">
            <div class="modal-info">
                <div id="modal_poster_wrap"></div>
                <div class="modal-meta">
                    <div class="modal-item-title" id="modal_item_title"></div>
                    <div class="modal-item-sub" id="modal_item_sub"></div>
                </div>
            </div>

            <div class="modal-field">
                <label class="modal-label">Quality Profile</label>
                <select class="modal-select" id="modal_profile">
                    <option value="">Loading profiles…</option>
                </select>
            </div>

            <div class="modal-field">
                <label class="modal-label">Storage Location</label>
                <div class="modal-path-wrap">
                    <input class="modal-input" id="modal_path" type="text" placeholder="e.g. /media/movies">
                    <button class="btn btn-ghost btn-sm" onclick="openBrowse()">Browse</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmMonitor()">Monitor</button>
            </div>
        </div>
    </div>

    <!-- Browse Popover -->
    <div id="browse_popover" class="browse-popover" style="display:none;" onclick="closeBrowseOnBg(event)">
        <div class="browse-box">
            <div class="browse-current" id="browse_current">Select a folder</div>
            <div class="browse-list" id="browse_list"></div>
            <div class="browse-actions">
                <button class="btn btn-ghost btn-sm" onclick="closeBrowse()">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="selectCurrentFolder()">Select This Folder</button>
            </div>
        </div>
    </div>

    <script>
        let allItems = []
        let searchResults = []
        let currentFilter = 'all'
        let searchTimeout = null
        const searchMap = {}

        let profiles = []
        let pendingItem = null   // item waiting to be confirmed in modal
        let browsePath = null

        // ── Init ─────────────────────────────────────────────────────────

        async function init() {
            const [, profilesRes] = await Promise.all([
                loadMonitor(),
                fetch('/api/profiles')
            ])
            const pd = await profilesRes.json()
            profiles = pd.profiles || []
        }

        // ── Monitored grid ───────────────────────────────────────────────

        async function loadMonitor() {
            const res = await fetch('/api/monitor')
            const data = await res.json()
            allItems = data.items || []
            renderGrid()
        }

        function setFilter(filter) {
            currentFilter = filter
            document.querySelectorAll('.filter-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.filter === filter))
            clearSearch()
            renderGrid()
        }

        function renderGrid() {
            const el = document.getElementById('monitor_content')
            const filtered = currentFilter === 'all'
                ? allItems
                : allItems.filter(i => i.type === currentFilter)
            if (!filtered.length) {
                el.innerHTML = '<div class="empty-state"><h2>Nothing monitored' +
                    (currentFilter !== 'all' ? ' in this category' : '') +
                    '</h2><p>Search above to add something.</p></div>'
                return
            }
            el.innerHTML = '<div class="poster-grid">' + filtered.map(monitorCard).join('') + '</div>'
            el.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation()
                    removeItem(btn.dataset.id, btn.dataset.type)
                })
            })
            el.querySelectorAll('.m-card').forEach(card => {
                card.addEventListener('click', () => {
                    window.location = '/?q=' + encodeURIComponent(card.dataset.title)
                })
            })
        }

        function monitorCard(item) {
            const poster = item.poster
                ? '<img src="' + item.poster + '" alt="" loading="lazy">'
                : '<div class="no-poster">' + (item.type === 'tv' ? '📺' : '🎬') + '</div>'
            return '<div class="m-card" data-title="' + escAttr(item.title) + '">' +
                poster +
                '<span class="type-tag">' + (item.type === 'tv' ? 'TV' : 'FILM') + '</span>' +
                '<button class="remove-btn" data-id="' + item.tmdb_id + '" data-type="' + item.type + '">✕</button>' +
                '<div class="card-info">' +
                '<div class="card-title" title="' + escAttr(item.title) + '">' + escHtml(item.title) + '</div>' +
                '<span class="countdown ' + (item.countdown_class || 'unknown') + '">' + escHtml(item.countdown) + '</span>' +
                '</div></div>'
        }

        async function removeItem(tmdbId, type) {
            await fetch('/api/monitor/remove', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tmdb_id: tmdbId, type: type})
            })
            allItems = allItems.filter(i => !(String(i.tmdb_id) === String(tmdbId) && i.type === type))
            renderGrid()
            const key = tmdbId + '|' + type
            if (searchMap[key]) {
                searchMap[key].monitored = false
                updateSearchCard(key)
            }
        }

        // ── Search ───────────────────────────────────────────────────────

        function onSearchInput(val) {
            clearTimeout(searchTimeout)
            document.getElementById('search_clear').style.display = val ? 'block' : 'none'
            if (!val.trim()) { clearSearchResults(); return }
            document.getElementById('search_section').style.display = 'block'
            document.getElementById('search_results').innerHTML =
                '<p style="font-size:0.85rem;color:var(--text-muted);">Searching…</p>'
            searchTimeout = setTimeout(() => doSearch(val.trim()), 400)
        }

        async function doSearch(q) {
            const res = await fetch('/api/tmdb/search?q=' + encodeURIComponent(q))
            const data = await res.json()
            searchResults = data.results || []
            searchResults.forEach(r => { searchMap[r.tmdb_id + '|' + r.type] = r })
            renderSearchCards()
        }

        function renderSearchCards() {
            const el = document.getElementById('search_results')
            if (!searchResults.length) {
                el.innerHTML = '<p style="font-size:0.85rem;color:var(--text-muted);">No results.</p>'
                return
            }
            el.innerHTML = '<div class="poster-grid">' + searchResults.map(searchCard).join('') + '</div>'
            el.querySelectorAll('.monitor-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.id + '|' + btn.dataset.type
                    const item = searchMap[key]
                    if (item && !item.monitored) openModal(item)
                })
            })
        }

        function searchCard(item) {
            const poster = item.poster
                ? '<img src="' + item.poster + '" alt="" loading="lazy">'
                : '<div class="no-poster">' + (item.type === 'tv' ? '📺' : '🎬') + '</div>'
            const mon = item.monitored
            return '<div class="s-card' + (mon ? ' is-monitored' : '') + '" id="sc-' + item.tmdb_id + '|' + item.type + '">' +
                poster +
                '<span class="type-tag">' + (item.type === 'tv' ? 'TV' : 'FILM') + '</span>' +
                '<div class="card-info">' +
                '<div class="card-title">' + escHtml(item.title) +
                (item.year ? ' <span class="card-year">(' + item.year + ')</span>' : '') + '</div>' +
                '<button class="monitor-btn' + (mon ? ' is-monitored' : '') + '"' +
                ' data-id="' + item.tmdb_id + '" data-type="' + item.type + '"' +
                (mon ? ' disabled' : '') + '>' +
                (mon ? '✓ Monitored' : '+ Monitor') +
                '</button></div></div>'
        }

        function updateSearchCard(key) {
            const item = searchMap[key]
            if (!item) return
            const el = document.getElementById('sc-' + key)
            if (!el) return
            const mon = item.monitored
            el.className = 's-card' + (mon ? ' is-monitored' : '')
            const btn = el.querySelector('.monitor-btn')
            btn.className = 'monitor-btn' + (mon ? ' is-monitored' : '')
            btn.disabled = mon
            btn.textContent = mon ? '✓ Monitored' : '+ Monitor'
        }

        function clearSearch() {
            document.getElementById('monitor_search').value = ''
            document.getElementById('search_clear').style.display = 'none'
            clearSearchResults()
        }

        function clearSearchResults() {
            document.getElementById('search_section').style.display = 'none'
            document.getElementById('search_results').innerHTML = ''
            searchResults = []
        }

        // ── Modal ────────────────────────────────────────────────────────

        function openModal(item) {
            pendingItem = item

            // poster
            const pw = document.getElementById('modal_poster_wrap')
            pw.innerHTML = item.poster
                ? '<img class="modal-poster" src="' + item.poster + '" alt="">'
                : '<div class="modal-poster-placeholder">' + (item.type === 'tv' ? '📺' : '🎬') + '</div>'

            document.getElementById('modal_item_title').textContent = item.title
            document.getElementById('modal_item_sub').textContent =
                (item.year ? item.year + ' · ' : '') + (item.type === 'tv' ? 'TV Show' : 'Movie')

            // profiles dropdown
            const sel = document.getElementById('modal_profile')
            const defaultProfile = profiles.find(p => p.is_default) || profiles[0]
            sel.innerHTML = profiles.map(p =>
                '<option value="' + escAttr(p.name) + '"' +
                (p.is_default ? ' selected' : '') + '>' +
                escHtml(p.name) + '</option>'
            ).join('')
            if (!profiles.length) sel.innerHTML = '<option value="">No profiles configured</option>'

            // path: pre-fill from config defaults based on type
            document.getElementById('modal_path').value = ''

            document.getElementById('monitor_modal').style.display = 'flex'
        }

        function closeModal() {
            document.getElementById('monitor_modal').style.display = 'none'
            pendingItem = null
        }

        function closeModalOnBg(e) {
            if (e.target === document.getElementById('monitor_modal')) closeModal()
        }

        async function confirmMonitor() {
            if (!pendingItem) return
            const profileName = document.getElementById('modal_profile').value
            const storagePath = document.getElementById('modal_path').value.trim()

            await fetch('/api/monitor/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    tmdb_id: pendingItem.tmdb_id,
                    type: pendingItem.type,
                    title: pendingItem.title,
                    monitor_type: 'all',
                    profile_name: profileName,
                    storage_path: storagePath
                })
            })

            pendingItem.monitored = true
            updateSearchCard(pendingItem.tmdb_id + '|' + pendingItem.type)
            closeModal()
            await loadMonitor()
        }

        // ── Browse ───────────────────────────────────────────────────────

        async function openBrowse() {
            browsePath = null
            document.getElementById('browse_popover').style.display = 'flex'
            await loadBrowse(null)
        }

        function closeBrowse() {
            document.getElementById('browse_popover').style.display = 'none'
        }

        function closeBrowseOnBg(e) {
            if (e.target === document.getElementById('browse_popover')) closeBrowse()
        }

        async function loadBrowse(path) {
            const url = path ? '/browse?path=' + encodeURIComponent(path) : '/browse'
            const res = await fetch(url)
            const data = await res.json()
            browsePath = data.current || path

            document.getElementById('browse_current').textContent = browsePath || 'Root'

            const list = document.getElementById('browse_list')
            list.innerHTML = ''

            if (data.parent !== undefined && data.parent !== null) {
                const up = document.createElement('div')
                up.className = 'browse-item'
                up.innerHTML = '📁 <span style="color:var(--text-muted);">.. (up)</span>'
                up.addEventListener('click', () => loadBrowse(data.parent))
                list.appendChild(up)
            }

            for (const item of data.items || []) {
                const el = document.createElement('div')
                el.className = 'browse-item'
                el.innerHTML = '📁 ' + escHtml(item.name)
                el.addEventListener('click', () => loadBrowse(item.path))
                list.appendChild(el)
            }
        }

        function selectCurrentFolder() {
            if (browsePath) {
                document.getElementById('modal_path').value = browsePath
            }
            closeBrowse()
        }

        // ── Run Cycle ────────────────────────────────────────────────────

        
        function showRunResults(results) {
            if (!results.length) {
                document.getElementById('run_results').style.display = 'none'
                return
            }
            document.getElementById('run_results').style.display = 'block'
            const colorMap = {sent:'var(--green)', no_results:'var(--text-muted)', no_match:'var(--text-muted)', qbit_error:'var(--red)', no_url:'var(--red)'}
            document.getElementById('run_results_list').innerHTML = results.map(r => {
                const color = colorMap[r.status] || 'var(--text-muted)'
                const label = {sent:'✓ Sent', no_results:'No results', no_match:'No profile match', qbit_error:'qBit error', no_url:'No URL'}[r.status] || r.status
                return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.83rem;">'
                    + '<span style="color:var(--text);">' + escHtml(r.item || r.query || '') + '</span>'
                    + '<span style="color:' + color + ';font-weight:600;">' + label + '</span></div>'
            }).join('')
        }

        // ── Helpers ──────────────────────────────────────────────────────

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        }
        function escAttr(s) {
            return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')
        }

        async function runNow() {
            const btn = document.getElementById('run_btn')
            btn.disabled = true
            btn.textContent = 'Running…'
            try {
                const res = await fetch('/api/monitor/run', {method:'POST'})
                const data = await res.json()
                renderRunLog(data.results || [])
                await loadMonitor()
            } catch(e) {
                console.error(e)
            }
            btn.disabled = false
            btn.innerHTML = '&#9654; Run Now'
        }

        function renderRunLog(results) {
            const el = document.getElementById('run_log')
            const content = document.getElementById('run_log_content')
            if (!results.length) { el.style.display = 'none'; return }
            el.style.display = 'block'
            const now = new Date().toLocaleTimeString()
            content.innerHTML = results.map(r => {
                const cls = r.skipped ? 'skip' : (r.status.includes('qBit failed') || r.status.includes('failed') ? 'fail' : 'ok')
                return '<div class="log-row ' + cls + '">' +
                    '<span class="log-title">' + escHtml(r.title) + '</span>' +
                    '<span class="log-status">' + escHtml(r.status) + '</span>' +
                    '<span class="log-ts">' + now + '</span>' +
                    '</div>'
            }).join('')
        }

        init()
    </script>
</body>
</html>
